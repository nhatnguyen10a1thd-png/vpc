<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="dnsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dnsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="dnsArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="dnsSuccess" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="1100" height="500" fill="url(#dnsBg)"/>

  <!-- Title -->
  <text x="40" y="45" fill="#f8fafc" font-size="18" font-weight="700">ROUTE 53 HYBRID DNS RESOLUTION WORKFLOW</text>
  <text x="40" y="68" fill="#94a3b8" font-size="12">Cross-VPC Private Hosted Zone Association &amp; Bidirectional Domain Name Resolution</text>

  <!-- Route 53 Private Hosted Zone Center Card -->
  <g transform="translate(370, 95)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="360" height="200" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="15" y="15" width="330" height="34" rx="6" fill="#1d4ed8"/>
    <text x="180" y="38" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Route 53 Private Hosted Zone: corp.internal</text>
    
    <g transform="translate(20, 65)">
      <text x="0" y="18" fill="#38bdf8" font-size="11" font-weight="700">DNS Resource Records (A Records):</text>
      <rect x="0" y="28" width="320" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="48" fill="#f8fafc" font-size="11" font-mono="true">app.corp.internal  -&gt;  10.20.10.50 (Cloud)</text>

      <rect x="0" y="66" width="320" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="86" fill="#f8fafc" font-size="11" font-mono="true">db.corp.internal   -&gt;  10.10.10.50 (On-Prem)</text>

      <text x="0" y="118" fill="#a5b4fc" font-size="10">Associated VPCs: vpc-cloud-useast1 &amp; vpc-onprem-uswest2</text>
    </g>
  </g>

  <!-- On-Prem Client (Left) -->
  <g transform="translate(40, 160)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="280" height="230" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="30" rx="6" fill="#4338ca"/>
    <text x="140" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">On-Prem Workload (10.10.10.50)</text>

    <text x="15" y="70" fill="#cbd5e1" font-size="11" font-weight="600">VPC DNS Resolver:</text>
    <text x="15" y="88" fill="#38bdf8" font-size="11" font-mono="true">10.10.0.2 (AmazonProvidedDNS)</text>

    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="250" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#a7f3d0" font-size="10" font-weight="700">Test Query 1:</text>
      <text x="10" y="36" fill="#cbd5e1" font-size="10" font-mono="true">$ dig +short app.corp.internal</text>
      <text x="10" y="50" fill="#34d399" font-size="10" font-mono="true">=&gt; 10.20.10.50 (Resolved!)</text>
    </g>
    <text x="15" y="205" fill="#94a3b8" font-size="10">Direct access via strongSwan IPsec VPN</text>
  </g>

  <!-- Cloud App Server (Right) -->
  <g transform="translate(780, 160)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="280" height="230" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="250" height="30" rx="6" fill="#047857"/>
    <text x="140" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Cloud App Server (10.20.10.50)</text>

    <text x="15" y="70" fill="#cbd5e1" font-size="11" font-weight="600">VPC DNS Resolver:</text>
    <text x="15" y="88" fill="#38bdf8" font-size="11" font-mono="true">10.20.0.2 (AmazonProvidedDNS)</text>

    <g transform="translate(15, 110)">
      <rect x="0" y="0" width="250" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" fill="#a7f3d0" font-size="10" font-weight="700">Test Query 2:</text>
      <text x="10" y="36" fill="#cbd5e1" font-size="10" font-mono="true">$ dig +short db.corp.internal</text>
      <text x="10" y="50" fill="#34d399" font-size="10" font-mono="true">=&gt; 10.10.10.50 (Resolved!)</text>
    </g>
    <text x="15" y="205" fill="#94a3b8" font-size="10">Direct access via strongSwan IPsec VPN</text>
  </g>

  <!-- Query Flow Arrows -->
  <path d="M 320 220 C 345 220, 345 240, 370 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dnsArrow)"/>
  <text x="345" y="210" fill="#38bdf8" font-size="9" text-anchor="middle">DNS Query</text>

  <path d="M 780 240 C 755 240, 755 220, 730 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#dnsArrow)"/>
  <text x="755" y="210" fill="#38bdf8" font-size="9" text-anchor="middle">DNS Query</text>

  <!-- Bottom VPN Data Path -->
  <g transform="translate(180, 420)">
    <rect x="0" y="0" width="740" height="55" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
    <text x="370" y="25" fill="#fbcfe8" font-size="11" font-weight="700" text-anchor="middle">IPsec Encrypted Traffic Flow (UDP 500 / 4500 ESP)</text>
    <text x="370" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">10.10.10.50:5432 &lt;================= Encrypted Wire =================&gt; 10.20.10.50:80</text>
  </g>
</svg>
