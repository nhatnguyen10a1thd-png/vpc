<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="dnsShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
  </defs>

  <rect width="1300" height="620" fill="#f8fafc"/>

  <!-- Top Title Bar -->
  <rect x="30" y="20" width="1240" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#dnsShadow)"/>
  <text x="50" y="48" fill="#0f172a" font-size="20" font-weight="800">
    📡 LUỒNG PHÂN GIẢI TÊN MIỀN LAI VỚI ROUTE 53 PRIVATE HOSTED ZONE (CROSS-VPC)
  </text>
  <text x="50" y="70" fill="#475569" font-size="13" font-weight="600">
    Cơ chế Cross-VPC Association cho phép phân giải FQDN hai chiều giữa On-Premises (10.10.0.0/16) và AWS Cloud (10.20.0.0/16)
  </text>

  <!-- Route 53 Private Hosted Zone (Center Card) -->
  <g transform="translate(430, 110)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="440" height="250" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="0" y="0" width="440" height="45" rx="12" fill="#0284c7"/>
    <rect x="0" y="30" width="440" height="15" fill="#0284c7"/>
    <text x="220" y="30" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">
      🌐 Route 53 Private Hosted Zone: corp.internal
    </text>

    <g transform="translate(25, 65)">
      <text x="0" y="16" fill="#0f172a" font-size="14" font-weight="800">Danh sách bản ghi phân giải (DNS A Records):</text>
      
      <!-- Record 1 -->
      <rect x="0" y="28" width="390" height="42" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="15" y="54" fill="#0369a1" font-size="14" font-family="monospace" font-weight="700">
        app.corp.internal  ➡️  10.20.10.50 (Cloud)
      </text>

      <!-- Record 2 -->
      <rect x="0" y="78" width="390" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="15" y="104" fill="#15803d" font-size="14" font-family="monospace" font-weight="700">
        db.corp.internal   ➡️  10.10.10.50 (On-Prem)
      </text>

      <line x1="0" y1="135" x2="390" y2="135" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="0" y="155" fill="#475569" font-size="13" font-weight="600">
        • VPC liên kết 1: vpc-cloud-useast1 (10.20.0.0/16)
      </text>
      <text x="0" y="175" fill="#475569" font-size="13" font-weight="600">
        • VPC liên kết 2: vpc-onprem-uswest2 (10.10.0.0/16) [Cross-VPC Auth]
      </text>
    </g>
  </g>

  <!-- Left: On-Premises Client Box -->
  <g transform="translate(30, 110)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="360" height="340" rx="12" fill="#ffffff" stroke="#4338ca" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="45" rx="12" fill="#4338ca"/>
    <rect x="0" y="30" width="360" height="15" fill="#4338ca"/>
    <text x="180" y="30" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">
      🏢 On-Premises Workload (10.10.10.50)
    </text>

    <g transform="translate(20, 65)">
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="700">DNS Server ngầm định của VPC:</text>
      <text x="0" y="40" fill="#4338ca" font-size="14" font-family="monospace" font-weight="800">10.10.0.2 (AmazonProvidedDNS)</text>

      <rect x="0" y="60" width="320" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="12" y="84" fill="#0f172a" font-size="13" font-weight="800">Lệnh kiểm thử truy vấn:</text>
      <text x="12" y="106" fill="#334155" font-size="13" font-family="monospace">$ dig +short app.corp.internal</text>
      <text x="12" y="130" fill="#16a34a" font-size="14" font-family="monospace" font-weight="800">=&gt; Trả về: 10.20.10.50 (OK)</text>

      <line x1="0" y1="170" x2="320" y2="170" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="0" y="195" fill="#475569" font-size="13">
        Sau khi có IP 10.20.10.50, gói tin được chuyển tiếp tới VPN Gateway 10.10.1.10 để sang Cloud.
      </text>
    </g>
  </g>

  <!-- Right: Cloud Workload Box -->
  <g transform="translate(910, 110)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="360" height="340" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="45" rx="12" fill="#16a34a"/>
    <rect x="0" y="30" width="360" height="15" fill="#16a34a"/>
    <text x="180" y="30" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">
      🚀 Cloud App Server (10.20.10.50)
    </text>

    <g transform="translate(20, 65)">
      <text x="0" y="18" fill="#0f172a" font-size="14" font-weight="700">DNS Server ngầm định của VPC:</text>
      <text x="0" y="40" fill="#15803d" font-size="14" font-family="monospace" font-weight="800">10.20.0.2 (AmazonProvidedDNS)</text>

      <rect x="0" y="60" width="320" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="12" y="84" fill="#0f172a" font-size="13" font-weight="800">Lệnh kiểm thử truy vấn:</text>
      <text x="12" y="106" fill="#334155" font-size="13" font-family="monospace">$ dig +short db.corp.internal</text>
      <text x="12" y="130" fill="#16a34a" font-size="14" font-family="monospace" font-weight="800">=&gt; Trả về: 10.10.10.50 (OK)</text>

      <line x1="0" y1="170" x2="320" y2="170" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="0" y="195" fill="#475569" font-size="13">
        Sau khi có IP 10.10.10.50, gói tin được chuyển tiếp tới VPN Gateway 10.20.1.10 để về On-Prem.
      </text>
    </g>
  </g>

  <!-- Query Arrows -->
  <line x1="390" y1="210" x2="430" y2="210" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <line x1="910" y1="210" x2="870" y2="210" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>

  <!-- Bottom Data Path -->
  <g transform="translate(30, 480)" filter="url(#dnsShadow)">
    <rect x="0" y="0" width="1240" height="110" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
    <text x="25" y="32" fill="#be185d" font-size="16" font-weight="800">
      🔒 ĐƯỜNG TRUYỀN DỮ LIỆU THỰC TẾ SAU KHI PHÂN GIẢI DNS (IPsec Encrypted Wire)
    </text>
    <rect x="25" y="48" width="1190" height="46" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
    <text x="620" y="76" fill="#831843" font-size="15" font-family="monospace" font-weight="800" text-anchor="middle">
      10.10.10.50:Client  &lt;====== [ Mã hóa IPsec ESP / UDP 4500 (MSS 1380) ] ======&gt;  10.20.10.50:80 (HTTP Nginx)
    </text>
  </g>
</svg>
