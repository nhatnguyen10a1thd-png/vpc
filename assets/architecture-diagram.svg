<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadow for clear separation -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrowVpn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#be185d" />
    </marker>
    <marker id="arrowRoute" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0369a1" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="920" fill="#f8fafc"/>

  <!-- ==================== TOP TITLE BAR ==================== -->
  <rect x="30" y="20" width="1380" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#boxShadow)"/>
  
  <text x="55" y="52" fill="#0f172a" font-size="22" font-weight="800" letter-spacing="0.5">
    SƠ ĐỒ KIẾN TRÚC MẠNG LAI: ON-PREMISES (VPC GIẢ LẬP) - SITE-TO-SITE VPN - AWS CLOUD
  </text>
  <text x="55" y="76" fill="#475569" font-size="14" font-weight="600">
    Môn học: Cloud 2026-2027 · GVHD: Huỳnh Xuân Phụng · Nhóm: Infrastructure (Đề tài cá nhân) · SV: Nhat Nguyen
  </text>

  <!-- Status Badges in Top Right -->
  <g transform="translate(1030, 36)">
    <rect x="0" y="0" width="170" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="85" y="22" fill="#0369a1" font-size="13" font-weight="700" text-anchor="middle">strongSwan IKEv2 / IPsec</text>
  </g>
  <g transform="translate(1215, 36)">
    <rect x="0" y="0" width="175" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="87" y="22" fill="#15803d" font-size="13" font-weight="700" text-anchor="middle">AWS Multi-Region</text>
  </g>

  <!-- ==================== LEFT: ON-PREMISES VPC ==================== -->
  <g id="on-prem-vpc">
    <!-- Outer VPC Box -->
    <rect x="30" y="115" width="530" height="645" rx="12" fill="#ffffff" stroke="#4338ca" stroke-width="2.5" filter="url(#boxShadow)"/>
    
    <!-- VPC Title Header -->
    <rect x="30" y="115" width="530" height="48" rx="12" fill="#4338ca"/>
    <rect x="30" y="145" width="530" height="18" fill="#4338ca"/>
    <text x="50" y="146" fill="#ffffff" font-size="17" font-weight="800">
      🏢 VPC ON-PREMISES (Giả lập tại us-west-2) · CIDR: 10.10.0.0/16
    </text>

    <!-- VPN Subnet (Public) -->
    <rect x="50" y="180" width="490" height="215" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="65" y="192" width="260" height="28" rx="5" fill="#0284c7"/>
    <text x="75" y="211" fill="#ffffff" font-size="14" font-weight="700">VPN Subnet (Public): 10.10.1.0/24</text>

    <!-- Internet Gateway Box -->
    <g transform="translate(65, 232)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="50" y="27" fill="#0369a1" font-size="13" font-weight="800" text-anchor="middle">IGW-OnPrem</text>
      <text x="50" y="47" fill="#64748b" font-size="12" text-anchor="middle">0.0.0.0/0</text>
    </g>

    <!-- strongSwan Gateway EC2 Box -->
    <g transform="translate(180, 232)">
      <rect x="0" y="0" width="345" height="145" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
      <rect x="0" y="0" width="345" height="30" rx="8" fill="#fce7f3"/>
      <rect x="0" y="20" width="345" height="10" fill="#fce7f3"/>
      <text x="15" y="21" fill="#9d174d" font-size="14" font-weight="800">🛡️ EC2: strongSwan VPN Gateway</text>
      
      <text x="15" y="50" fill="#0f172a" font-size="13" font-weight="700">Private IP: <tspan fill="#0284c7">10.10.1.10</tspan></text>
      <text x="15" y="70" fill="#0f172a" font-size="13" font-weight="700">Elastic IP (Public): <tspan fill="#b91c1c">54.x.x.10 (EIP-OnPrem)</tspan></text>
      <text x="15" y="90" fill="#0f172a" font-size="13" font-weight="700">Source/Dest Check: <tspan fill="#b91c1c">DISABLED (Bắt buộc)</tspan></text>
      <text x="15" y="110" fill="#334155" font-size="13">Dịch vụ: strongSwan 5.9+ / IKEv2 daemon</text>
      <text x="15" y="130" fill="#334155" font-size="13">Firewall SG: Mở UDP 500, UDP 4500, ESP (50)</text>
    </g>

    <!-- Workload Subnet (Private) -->
    <rect x="50" y="410" width="490" height="175" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="65" y="422" width="280" height="28" rx="5" fill="#16a34a"/>
    <text x="75" y="441" fill="#ffffff" font-size="14" font-weight="700">Workload Subnet (Private): 10.10.10.0/24</text>

    <!-- Workload Host Box -->
    <g transform="translate(65, 460)">
      <rect x="0" y="0" width="460" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
      <text x="15" y="28" fill="#15803d" font-size="15" font-weight="800">💻 EC2: On-Premises Workload / Client Instance</text>
      <text x="15" y="52" fill="#0f172a" font-size="13" font-weight="700">Private IP: <tspan fill="#15803d">10.10.10.50</tspan> (Không có Public IP / Cô lập an toàn)</text>
      <text x="15" y="74" fill="#334155" font-size="13">Công cụ: iperf3 client, ICMP ping tester, curl, DB Client</text>
      <text x="15" y="96" fill="#0f172a" font-size="13" font-weight="700">Đích đến 10.20.0.0/16: <tspan fill="#0369a1">Định tuyến qua Next-hop 10.10.1.10</tspan></text>
    </g>

    <!-- Route Table Box (On-Prem) -->
    <g transform="translate(50, 600)">
      <rect x="0" y="0" width="490" height="145" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="15" y="25" fill="#1e293b" font-size="14" font-weight="800">📋 BẢNG ĐỊNH TUYẾN (Route Table - On-Premises):</text>
      <line x1="15" y1="36" x2="475" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <text x="15" y="60" fill="#334155" font-size="13" font-family="monospace" font-weight="600">• 10.10.0.0/16   ➡️  local (Giao tiếp nội bộ VPC On-Prem)</text>
      <text x="15" y="86" fill="#334155" font-size="13" font-family="monospace" font-weight="600">• 0.0.0.0/0      ➡️  igw-onprem (Truy cập Internet qua Public RT)</text>
      <text x="15" y="114" fill="#be185d" font-size="14" font-family="monospace" font-weight="800">• 10.20.0.0/16   ➡️  eni-strongswan (10.10.1.10) [Lưu lượng sang Cloud]</text>
    </g>
  </g>

  <!-- ==================== CENTER: IPSEC VPN TUNNEL ==================== -->
  <g id="vpn-tunnel-transit">
    <!-- Tunnel Outer Box -->
    <rect x="585" y="180" width="270" height="405" rx="12" fill="#ffffff" stroke="#be185d" stroke-width="2.5" filter="url(#boxShadow)"/>
    
    <!-- Tunnel Header -->
    <rect x="585" y="180" width="270" height="45" rx="12" fill="#be185d"/>
    <rect x="585" y="210" width="270" height="15" fill="#be185d"/>
    <text x="720" y="210" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">
      🔒 SITE-TO-SITE IPSEC VPN
    </text>

    <!-- Tunnel Arrow Connection Lines -->
    <line x1="525" y1="290" x2="585" y2="290" stroke="#be185d" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrowVpn)"/>
    <line x1="855" y1="290" x2="915" y2="290" stroke="#be185d" stroke-width="4" stroke-dasharray="8,4" marker-end="url(#arrowVpn)"/>

    <!-- Specifications Content -->
    <g transform="translate(600, 240)">
      <text x="0" y="20" fill="#0f172a" font-size="14" font-weight="800">THÔNG SỐ ĐƯỜNG HẦM:</text>
      
      <text x="0" y="48" fill="#334155" font-size="13" font-weight="700">• Giao thức: <tspan fill="#be185d">IKEv2 / IPsec ESP</tspan></text>
      <text x="0" y="70" fill="#334155" font-size="13" font-weight="700">• Xác thực: <tspan fill="#be185d">Pre-Shared Key (PSK)</tspan></text>
      
      <line x1="0" y1="84" x2="240" y2="84" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="0" y="106" fill="#0f172a" font-size="13" font-weight="800">Phase 1 (IKE SA):</text>
      <text x="12" y="126" fill="#475569" font-size="13">• Mã hóa: AES-256-GCM</text>
      <text x="12" y="146" fill="#475569" font-size="13">• Băm: SHA-256 / SHA-384</text>
      <text x="12" y="166" fill="#475569" font-size="13">• DH Group: 14 (MODP2048)</text>
      <text x="12" y="186" fill="#475569" font-size="13">• Lifetime: 28,800s (8 giờ)</text>

      <line x1="0" y1="200" x2="240" y2="200" stroke="#e2e8f0" stroke-width="1.5"/>

      <text x="0" y="222" fill="#0f172a" font-size="13" font-weight="800">Phase 2 (Child SA / ESP):</text>
      <text x="12" y="242" fill="#475569" font-size="13">• Mã hóa: AES-256-GCM-128</text>
      <text x="12" y="262" fill="#475569" font-size="13">• Lifetime: 3,600s (1 giờ)</text>
      
      <line x1="0" y1="276" x2="240" y2="276" stroke="#e2e8f0" stroke-width="1.5"/>

      <rect x="0" y="288" width="240" height="46" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
      <text x="120" y="308" fill="#9d174d" font-size="13" font-weight="800" text-anchor="middle">Firewall: UDP 500 &amp; UDP 4500</text>
      <text x="120" y="325" fill="#be185d" font-size="12" font-weight="700" text-anchor="middle">MSS Clamped: 1380 bytes</text>
    </g>
  </g>

  <!-- ==================== RIGHT: AWS CLOUD VPC ==================== -->
  <g id="cloud-vpc">
    <!-- Outer VPC Box -->
    <rect x="880" y="115" width="530" height="645" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" filter="url(#boxShadow)"/>
    
    <!-- VPC Title Header -->
    <rect x="880" y="115" width="530" height="48" rx="12" fill="#15803d"/>
    <rect x="880" y="145" width="530" height="18" fill="#15803d"/>
    <text x="900" y="146" fill="#ffffff" font-size="17" font-weight="800">
      🚀 VPC AWS CLOUD (Production tại us-east-1) · CIDR: 10.20.0.0/16
    </text>

    <!-- VPN Subnet (Public) -->
    <rect x="900" y="180" width="490" height="215" rx="10" fill="#f8fafc" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="915" y="192" width="260" height="28" rx="5" fill="#0284c7"/>
    <text x="925" y="211" fill="#ffffff" font-size="14" font-weight="700">VPN Subnet (Public): 10.20.1.0/24</text>

    <!-- strongSwan Gateway EC2 Box -->
    <g transform="translate(915, 232)">
      <rect x="0" y="0" width="345" height="145" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
      <rect x="0" y="0" width="345" height="30" rx="8" fill="#fce7f3"/>
      <rect x="0" y="20" width="345" height="10" fill="#fce7f3"/>
      <text x="15" y="21" fill="#9d174d" font-size="14" font-weight="800">🛡️ EC2: strongSwan Cloud Gateway</text>
      
      <text x="15" y="50" fill="#0f172a" font-size="13" font-weight="700">Private IP: <tspan fill="#0284c7">10.20.1.10</tspan></text>
      <text x="15" y="70" fill="#0f172a" font-size="13" font-weight="700">Elastic IP (Public): <tspan fill="#b91c1c">3.x.x.20 (EIP-Cloud)</tspan></text>
      <text x="15" y="90" fill="#0f172a" font-size="13" font-weight="700">Source/Dest Check: <tspan fill="#b91c1c">DISABLED (Bắt buộc)</tspan></text>
      <text x="15" y="110" fill="#334155" font-size="13">Tùy chọn phụ: Hỗ trợ AWS VGW (Demo rồi xóa)</text>
      <text x="15" y="130" fill="#334155" font-size="13">Firewall SG: Mở UDP 500, UDP 4500, ESP (50)</text>
    </g>

    <!-- Internet Gateway Box -->
    <g transform="translate(1275, 232)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="50" y="27" fill="#0369a1" font-size="13" font-weight="800" text-anchor="middle">IGW-Cloud</text>
      <text x="50" y="47" fill="#64748b" font-size="12" text-anchor="middle">0.0.0.0/0</text>
    </g>

    <!-- Workload Subnet (Private) -->
    <rect x="900" y="410" width="490" height="175" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="915" y="422" width="280" height="28" rx="5" fill="#16a34a"/>
    <text x="925" y="441" fill="#ffffff" font-size="14" font-weight="700">Workload Subnet (Private): 10.20.10.0/24</text>

    <!-- Workload Cloud Host Box -->
    <g transform="translate(915, 460)">
      <rect x="0" y="0" width="460" height="110" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
      <text x="15" y="28" fill="#15803d" font-size="15" font-weight="800">🖥️ EC2: Cloud Workload / Web Nginx Server</text>
      <text x="15" y="52" fill="#0f172a" font-size="13" font-weight="700">Private IP: <tspan fill="#15803d">10.20.10.50</tspan> (Không có Public IP / Cô lập an toàn)</text>
      <text x="15" y="74" fill="#334155" font-size="13">Dịch vụ: Nginx HTTP web, Web API, iperf3 server</text>
      <text x="15" y="96" fill="#0f172a" font-size="13" font-weight="700">Đích đến 10.10.0.0/16: <tspan fill="#0369a1">Định tuyến qua Next-hop 10.20.1.10</tspan></text>
    </g>

    <!-- Route Table Box (Cloud) -->
    <g transform="translate(900, 600)">
      <rect x="0" y="0" width="490" height="145" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="15" y="25" fill="#1e293b" font-size="14" font-weight="800">📋 BẢNG ĐỊNH TUYẾN (Route Table - AWS Cloud):</text>
      <line x1="15" y1="36" x2="475" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <text x="15" y="60" fill="#334155" font-size="13" font-family="monospace" font-weight="600">• 10.20.0.0/16   ➡️  local (Giao tiếp nội bộ VPC Cloud)</text>
      <text x="15" y="86" fill="#334155" font-size="13" font-family="monospace" font-weight="600">• 0.0.0.0/0      ➡️  igw-cloud (Truy cập Internet qua Public RT)</text>
      <text x="15" y="114" fill="#0369a1" font-size="14" font-family="monospace" font-weight="800">• 10.10.0.0/16   ➡️  eni-strongswan (10.20.1.10) [Lưu lượng về On-Prem]</text>
    </g>
  </g>

  <!-- ==================== BOTTOM BAR: ROUTE 53 & LAB GOVERNANCE ==================== -->
  <g id="bottom-services" transform="translate(30, 780)">
    <rect x="0" y="0" width="1380" height="115" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)"/>
    
    <!-- Route 53 Left Card -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="760" height="85" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="15" y="28" fill="#0369a1" font-size="15" font-weight="800">📡 HỆ THỐNG PHÂN GIẢI TÊN MIỀN LAI: Route 53 Private Hosted Zone (corp.internal)</text>
      <text x="15" y="52" fill="#0f172a" font-size="13" font-weight="600">
        • Liên kết xuyên vùng: Cross-VPC Association gắn cả VPC On-Premises (10.10.0.0/16) và VPC Cloud (10.20.0.0/16)
      </text>
      <text x="15" y="74" fill="#0369a1" font-size="13" font-family="monospace" font-weight="700">
        • Bản ghi DNS: app.corp.internal ➡️ 10.20.10.50 (Cloud)  |  db.corp.internal ➡️ 10.10.10.50 (On-Prem)
      </text>
    </g>

    <!-- Governance Right Card -->
    <g transform="translate(800, 15)">
      <rect x="0" y="0" width="560" height="85" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
      <text x="15" y="28" fill="#1e293b" font-size="15" font-weight="800">⚙️ QUẢN TRỊ NỀN TẢNG &amp; RÀNG BUỘC AWS LEARNER LAB</text>
      <text x="15" y="52" fill="#334155" font-size="13">
        • Phân quyền IAM: Gắn IAM LabRole có sẵn cho EC2 truy cập lưu trữ cấu hình S3
      </text>
      <text x="15" y="74" fill="#334155" font-size="13">
        • Chiến lược Tagging: Project=Hybrid-Cloud-VPN, Env=Lab-Simulation, Course=Cloud-Dot1-2026-2027
      </text>
    </g>
  </g>
</svg>
