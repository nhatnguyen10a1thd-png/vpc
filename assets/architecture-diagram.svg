<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="onpremGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="vpnTunnelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-vpn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="760" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.2">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    
    <line x1="160" y1="0" x2="160" y2="760"/>
    <line x1="320" y1="0" x2="320" y2="760"/>
    <line x1="480" y1="0" x2="480" y2="760"/>
    <line x1="640" y1="0" x2="640" y2="760"/>
    <line x1="800" y1="0" x2="800" y2="760"/>
    <line x1="960" y1="0" x2="960" y2="760"/>
    <line x1="1120" y1="0" x2="1120" y2="760"/>
  </g>

  <!-- ==================== HEADER BAR ==================== -->
  <rect x="30" y="20" width="1220" height="65" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <text x="50" y="58" fill="url(#headerGrad)" font-size="20" font-weight="700" letter-spacing="0.5">
    HYBRID NETWORK ARCHITECTURE · SOFTWARE-BASED SITE-TO-SITE IPSEC VPN
  </text>
  
  <g transform="translate(940, 36)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="18" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Course: Cloud 2026-2027</text>
  </g>
  <g transform="translate(1090, 36)">
    <rect x="0" y="0" width="145" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
    <text x="72" y="18" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">GVHD: Huỳnh Xuân Phụng</text>
  </g>

  <!-- ==================== ON-PREMISES VPC (LEFT) ==================== -->
  <g id="on-prem-vpc">
    <!-- VPC Boundary -->
    <rect x="30" y="105" width="480" height="540" rx="16" fill="url(#onpremGrad)" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- VPC Header Badge -->
    <rect x="50" y="125" width="440" height="42" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <circle cx="72" cy="146" r="10" fill="#6366f1"/>
    <text x="72" y="150" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">DC</text>
    <text x="92" y="145" fill="#f8fafc" font-size="14" font-weight="700">Simulated On-Premises VPC (us-west-2)</text>
    <text x="92" y="159" fill="#a5b4fc" font-size="11" font-mono="true">CIDR: 10.10.0.0/16 · Tag: Env=OnPrem-DC</text>

    <!-- Public Gateway Subnet -->
    <rect x="50" y="180" width="440" height="195" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="62" y="190" width="220" height="22" rx="4" fill="#0369a1"/>
    <text x="70" y="205" fill="#ffffff" font-size="11" font-weight="600">VPN Subnet: 10.10.1.0/24 (AZ a)</text>

    <!-- Internet Gateway Box -->
    <g transform="translate(65, 222)">
      <rect x="0" y="0" width="90" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="45" y="20" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">IGW-OnPrem</text>
      <text x="45" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">0.0.0.0/0</text>
    </g>

    <!-- strongSwan Gateway EC2 -->
    <g transform="translate(170, 222)">
      <rect x="0" y="0" width="305" height="140" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <rect x="10" y="10" width="285" height="24" rx="4" fill="#831843"/>
      <text x="152" y="26" fill="#fbcfe8" font-size="11" font-weight="700" text-anchor="middle">EC2: strongSwan Gateway (On-Prem Edge)</text>
      
      <text x="14" y="52" fill="#e2e8f0" font-size="10" font-weight="600">Private IP: <tspan fill="#38bdf8">10.10.1.10</tspan></text>
      <text x="14" y="68" fill="#e2e8f0" font-size="10" font-weight="600">Elastic IP (Public): <tspan fill="#f43f5e">54.x.x.10 (EIP-OnPrem)</tspan></text>
      <text x="14" y="84" fill="#e2e8f0" font-size="10" font-weight="600">Source/Dest Check: <tspan fill="#ef4444" font-weight="700">DISABLED (Required)</tspan></text>
      <text x="14" y="100" fill="#e2e8f0" font-size="10" font-weight="600">Services: <tspan fill="#a5b4fc">strongSwan 5.9+ / IKEv2 daemon</tspan></text>
      <text x="14" y="116" fill="#e2e8f0" font-size="10" font-weight="600">Security Group: <tspan fill="#cbd5e1">UDP 500, UDP 4500, ESP (50)</tspan></text>
      <text x="14" y="130" fill="#94a3b8" font-size="9" font-style="italic">MSS Clamping enabled (iptables: 1380 bytes)</text>
    </g>

    <!-- Private Workload Subnet -->
    <rect x="50" y="388" width="440" height="135" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="62" y="398" width="240" height="22" rx="4" fill="#047857"/>
    <text x="70" y="413" fill="#ffffff" font-size="11" font-weight="600">Workload Subnet: 10.10.10.0/24 (AZ a)</text>

    <!-- Workload Client / Server EC2 -->
    <g transform="translate(65, 430)">
      <rect x="0" y="0" width="410" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="24" fill="#a7f3d0" font-size="12" font-weight="700">EC2: On-Prem Workload / Client Instance</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="11">Private IP: <tspan fill="#10b981" font-weight="700">10.10.10.50</tspan> · No Public IP / EIP</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="11">Workloads: iperf3 Client, ICMP ping tester, Curl/HTTP, Internal DB</text>
      <text x="15" y="74" fill="#64748b" font-size="10">Target Route: 10.20.0.0/16 via 10.10.1.10 (Gateway ENI)</text>
    </g>

    <!-- Route Table Summary Box -->
    <rect x="50" y="534" width="440" height="98" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="65" y="552" fill="#94a3b8" font-size="11" font-weight="700">ROUTING TABLE SUMMARY (On-Prem VPC):</text>
    <text x="65" y="572" fill="#e2e8f0" font-size="10" font-mono="true">10.10.0.0/16   -&gt;  Local</text>
    <text x="65" y="590" fill="#e2e8f0" font-size="10" font-mono="true">0.0.0.0/0      -&gt;  igw-onprem (Public RT)</text>
    <text x="65" y="608" fill="#f43f5e" font-size="10" font-mono="true">10.20.0.0/16   -&gt;  eni-strongswan (10.10.1.10) [Traffic to Cloud]</text>
  </g>

  <!-- ==================== CENTRAL TRANSIT / IPSEC TUNNEL ==================== -->
  <g id="ipsec-tunnel">
    <!-- Tunnel Outer glow / box -->
    <rect x="525" y="160" width="230" height="340" rx="14" fill="#0f172a" fill-opacity="0.95" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Badge -->
    <rect x="545" y="175" width="190" height="32" rx="6" fill="#831843"/>
    <text x="640" y="196" fill="#fbcfe8" font-size="12" font-weight="700" text-anchor="middle">IPsec VPN Tunnel</text>

    <!-- Tunnel Connection Graphic Lines -->
    <path d="M 475 285 L 530 285" stroke="#ec4899" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-vpn)" filter="url(#glow)"/>
    <path d="M 755 285 L 810 285" stroke="#ec4899" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-vpn)" filter="url(#glow)"/>

    <!-- Tunnel Info Specs -->
    <g transform="translate(540, 222)">
      <rect x="0" y="0" width="200" height="260" rx="8" fill="#1e1b4b" fill-opacity="0.6" stroke="#4f46e5" stroke-width="1"/>
      
      <text x="10" y="24" fill="#a5b4fc" font-size="11" font-weight="700">TUNNEL PARAMETERS:</text>
      
      <text x="10" y="48" fill="#cbd5e1" font-size="10" font-weight="600">Protocol: <tspan fill="#38bdf8">IKEv2 / IPsec ESP</tspan></text>
      <text x="10" y="68" fill="#cbd5e1" font-size="10" font-weight="600">Auth: <tspan fill="#38bdf8">Pre-Shared Key (PSK)</tspan></text>
      
      <path d="M 10 78 L 190 78" stroke="#4338ca" stroke-width="1"/>
      
      <text x="10" y="96" fill="#f472b6" font-size="10" font-weight="700">Phase 1 (IKE SA):</text>
      <text x="15" y="112" fill="#94a3b8" font-size="9">Cipher: AES-256-GCM / SHA-256</text>
      <text x="15" y="126" fill="#94a3b8" font-size="9">DH Group: 14 (MODP2048) / 19</text>
      <text x="15" y="140" fill="#94a3b8" font-size="9">Lifetime: 28,800s (8h)</text>
      
      <path d="M 10 150 L 190 150" stroke="#4338ca" stroke-width="1"/>

      <text x="10" y="168" fill="#34d399" font-size="10" font-weight="700">Phase 2 (Child SA):</text>
      <text x="15" y="184" fill="#94a3b8" font-size="9">ESP: AES-256-GCM-128</text>
      <text x="15" y="198" fill="#94a3b8" font-size="9">PFS: Group 14 (Optional)</text>
      <text x="15" y="212" fill="#94a3b8" font-size="9">Lifetime: 3,600s (1h)</text>
      
      <path d="M 10 222 L 190 222" stroke="#4338ca" stroke-width="1"/>
      <text x="100" y="242" fill="#e0e7ff" font-size="10" font-weight="700" text-anchor="middle">Firewall: UDP 500 / 4500</text>
    </g>
  </g>

  <!-- ==================== AWS CLOUD VPC (RIGHT) ==================== -->
  <g id="cloud-vpc">
    <!-- VPC Boundary -->
    <rect x="770" y="105" width="480" height="540" rx="16" fill="url(#cloudGrad)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- VPC Header Badge -->
