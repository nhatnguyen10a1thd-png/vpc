    <circle cx="812" cy="146" r="10" fill="#10b981"/>
    <text x="812" y="150" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">AWS</text>
    <text x="832" y="145" fill="#f8fafc" font-size="14" font-weight="700">Production Cloud VPC (us-east-1)</text>
    <text x="832" y="159" fill="#a7f3d0" font-size="11" font-mono="true">CIDR: 10.20.0.0/16 · Tag: Env=Cloud-Prod</text>

    <!-- Public Gateway Subnet -->
    <rect x="790" y="180" width="440" height="195" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="802" y="190" width="210" height="22" rx="4" fill="#0369a1"/>
    <text x="810" y="205" fill="#ffffff" font-size="11" font-weight="600">VPN Subnet: 10.20.1.0/24 (AZ a)</text>

    <!-- strongSwan Gateway EC2 (or VGW Option) -->
    <g transform="translate(805, 222)">
      <rect x="0" y="0" width="305" height="140" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <rect x="10" y="10" width="285" height="24" rx="4" fill="#065f46"/>
      <text x="152" y="26" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle">EC2: strongSwan Cloud Gateway (Preferred)</text>
      
      <text x="14" y="52" fill="#e2e8f0" font-size="10" font-weight="600">Private IP: <tspan fill="#38bdf8">10.20.1.10</tspan></text>
      <text x="14" y="68" fill="#e2e8f0" font-size="10" font-weight="600">Elastic IP (Public): <tspan fill="#f43f5e">3.x.x.20 (EIP-Cloud)</tspan></text>
      <text x="14" y="84" fill="#e2e8f0" font-size="10" font-weight="600">Source/Dest Check: <tspan fill="#ef4444" font-weight="700">DISABLED (Required)</tspan></text>
      <text x="14" y="100" fill="#e2e8f0" font-size="10" font-weight="600">Dual Option: <tspan fill="#f59e0b">AWS VGW Supported (Demo &amp; Delete)</tspan></text>
      <text x="14" y="116" fill="#e2e8f0" font-size="10" font-weight="600">Security Group: <tspan fill="#cbd5e1">UDP 500, UDP 4500, ESP (50)</tspan></text>
      <text x="14" y="130" fill="#94a3b8" font-size="9" font-style="italic">MSS Clamping enabled (iptables: 1380 bytes)</text>
    </g>

    <!-- Internet Gateway Box -->
    <g transform="translate(1125, 222)">
      <rect x="0" y="0" width="90" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="45" y="20" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">IGW-Cloud</text>
      <text x="45" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">0.0.0.0/0</text>
    </g>

    <!-- Private Workload Subnet -->
    <rect x="790" y="388" width="440" height="135" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,2"/>
    <rect x="802" y="398" width="240" height="22" rx="4" fill="#047857"/>
    <text x="810" y="413" fill="#ffffff" font-size="11" font-weight="600">Workload Subnet: 10.20.10.0/24 (AZ a)</text>

    <!-- Workload Cloud Server EC2 -->
    <g transform="translate(805, 430)">
      <rect x="0" y="0" width="410" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="24" fill="#a7f3d0" font-size="12" font-weight="700">EC2: Cloud Workload / Nginx Web Server</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="11">Private IP: <tspan fill="#10b981" font-weight="700">10.20.10.50</tspan> · Isolated Workload</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="11">Services: Web API, iperf3 Server, Internal Microservices</text>
      <text x="15" y="74" fill="#64748b" font-size="10">Target Route: 10.10.0.0/16 via 10.20.1.10 (Gateway ENI)</text>
    </g>

    <!-- Route Table Summary Box -->
    <rect x="790" y="534" width="440" height="98" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="805" y="552" fill="#94a3b8" font-size="11" font-weight="700">ROUTING TABLE SUMMARY (Cloud VPC):</text>
    <text x="805" y="572" fill="#e2e8f0" font-size="10" font-mono="true">10.20.0.0/16    -&gt;  Local</text>
    <text x="805" y="590" fill="#e2e8f0" font-size="10" font-mono="true">0.0.0.0/0       -&gt;  igw-cloud (Public RT)</text>
    <text x="805" y="608" fill="#38bdf8" font-size="10" font-mono="true">10.10.0.0/16    -&gt;  eni-strongswan (10.20.1.10) [Traffic to On-Prem]</text>
  </g>

  <!-- ==================== ROUTE 53 & SHARED SERVICES BAR (BOTTOM) ==================== -->
  <g id="shared-services" transform="translate(30, 660)">
    <rect x="0" y="0" width="1220" height="80" rx="12" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Route 53 Badge & Details -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="42" height="50" rx="6" fill="#1d4ed8"/>
      <text x="21" y="32" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">R53</text>
      <text x="52" y="22" fill="#60a5fa" font-size="13" font-weight="700">Route 53 Private Hosted Zone (corp.internal)</text>
      <text x="52" y="42" fill="#cbd5e1" font-size="11">Cross-VPC Association (Cloud VPC + On-Prem VPC) · app.corp.internal (10.20.10.50) · db.corp.internal (10.10.10.50)</text>
    </g>

    <!-- LabRole & S3 Badge -->
    <g transform="translate(730, 15)">
      <rect x="0" y="0" width="460" height="50" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" fill="#f59e0b" font-size="12" font-weight="700">AWS Academy LabRole &amp; S3 Config Storage</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">EC2 Attached IAM LabRole · S3 Bucket: hybrid-vpn-config-backup-2026 for strongSwan configs</text>
    </g>
