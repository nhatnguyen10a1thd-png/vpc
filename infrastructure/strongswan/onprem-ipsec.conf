# ==============================================================================
# strongSwan IPsec Configuration: On-Premises Gateway (us-west-2 - Oregon)
# Local Subnet: 10.10.0.0/16 | Remote Subnet: 10.20.0.0/16
# Course: Cloud - Dot 1 - 2026-2027 | GVHD: Huynh Xuan Phung | Student: Nhat Nguyen
# ==============================================================================

config setup
    charondebug="ike 2, knl 2, cfg 2, net 2, esp 2"
    uniqueids=yes

conn %default
    ikelifetime=28800s
    keylife=3600s
    rekeymargin=3m
    keyingtries=%forever
    keyexchange=ikev2
    authby=secret
    dpddelay=30s
    dpdtimeout=120s
    dpdaction=restart

conn onprem-to-cloud
    # Local Gateway Settings (On-Premises)
    left=%defaultroute
    leftid=REPLACE_WITH_ONPREM_EIP
    leftsubnet=10.10.0.0/16
    leftfirewall=yes

    # Remote Gateway Settings (AWS Cloud us-east-1)
    right=REPLACE_WITH_CLOUD_EIP
    rightid=REPLACE_WITH_CLOUD_EIP
    rightsubnet=10.20.0.0/16

    # Cryptographic Suite (Phase 1 & Phase 2)
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256-modp2048!

    # Tunnel Startup Trigger
    auto=start
